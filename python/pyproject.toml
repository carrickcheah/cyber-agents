[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyber-agents"
version = "0.1.0"
description = "AI-security auditor — score any AI endpoint against Responsible-AI metrics, plus a 44-control safety register (early/experimental)"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Carrick Cheah" }]
keywords = ["ai", "security", "agents", "guardrails", "llm", "responsible-ai", "safety"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/carrickcheah/cyber-agents"
Repository = "https://github.com/carrickcheah/cyber-agents"

[tool.hatch.build.targets.wheel]
packages = ["src/cyber_agents"]
